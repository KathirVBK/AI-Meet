services:
  - type: web
    name: aimeet-backend
    runtime: python
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn api_server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STT_BACKEND
        value: groq
      - key: WHISPER_MODEL
        value: whisper-large-v3
      - key: GROQ_LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
